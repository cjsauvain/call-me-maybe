[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jordan Sauvain", email = "102552311+cjsauvain@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "llm-sdk",
    "accelerate>=1.15.0",
]

[project.scripts]
call-me-maybe = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = "."

[tool.uv.sources]
llm-sdk = { path = "./src/lib/llm_sdk" }
